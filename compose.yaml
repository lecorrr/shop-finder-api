# Everything for local development. Ports are published on 127.0.0.1 only, and on
# non-default numbers so they do not clash with databases already on the machine.
name: shop-finder

x-app: &app
  build: .
  image: shop-finder-api:local
  env_file: .env
  # Inside the Compose network the services are reached by name, not through 127.0.0.1.
  environment:
    DATABASE_URL: postgres://shopfinder:${POSTGRES_PASSWORD:?run scripts/make_env.py first}@postgres:5432/shopfinder
    MONGO_URL: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: rediscache://redis:6379/1
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shopfinder
      POSTGRES_USER: shopfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/make_env.py first}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker: mount the parent.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfinder -d shopfinder"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_mongo"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5

  worker:
    <<: *app
    command: ["celery", "-A", "shopfinder", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
